<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Workouts</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="../style/workout.css">
</head>

<!-- Override API base like: data-api-base="http://localhost:8001" -->
<body class="bg-light" data-api-base="">
  <!-- NAVBAR (kept consistent with home.html style) -->
  <nav class="navbar navbar-expand-lg bg-white shadow-sm px-3 py-2 custom-navbar">
    <a class="navbar-brand d-flex align-items-center me-4" href="home.html">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTmk6m_1oIiq0PrcxCCK9wyFl1Yt-NUPV_zXA&s" alt="logo" height="40" width="50" class="me-3">
      <span class="fw-bold">GYM<br><small>System</small></span>
    </a>
    <div class="navbar-nav ms-auto">
      <a class="nav-link rounded-pill px-3 py-1 custom-link" href="home.html">Dashboard</a>
      <a class="nav-link rounded-pill px-3 py-1 custom-link active" href="#">Workouts</a>
    </div>
    <div class="ms-3 d-flex align-items-center gap-2">
      <a class="btn btn-outline-danger rounded-pill d-flex align-items-center gap-1 custom-login" href="#" id="logoutBtn">
        <i class="bi bi-box-arrow-right"></i> Logout
      </a>
    </div>
  </nav>

  <main class="container py-4">
    <h1 class="display-6 fw-bold text-center mb-4">WORKOUTS</h1>

    <!-- Big rounded search bar -->
    <div class="workout-search mb-4 d-flex align-items-center">
      <input id="searchInput" class="form-control workout-search-input" type="search"
             placeholder="Search workouts by name, type, level, intensity…" />
      <button id="searchBtn" class="btn workout-search-btn ms-2" aria-label="Search">
        <i class="bi bi-search"></i>
      </button>
    </div>

    <!-- Grid -->
    <div id="grid" class="row g-4"></div>

    <!-- Pagination -->
    <div id="pager" class="pagination-wrap mt-4 d-flex justify-content-center align-items-center gap-2"></div>

    <!-- Empty state -->
    <div id="emptyState" class="text-center text-muted py-5 d-none">
      <i class="bi bi-inbox fs-2 d-block mb-2"></i>
      <p class="mb-0">No workouts found.</p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../javascript/workout.js"></script>
</body>
</html>

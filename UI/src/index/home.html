<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Foodstock Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="../style/homeStyle.css">
</head>

<body>
  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg bg-white shadow-sm px-3 py-2 custom-navbar">
    <a class="navbar-brand d-flex align-items-center me-4" href="#">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTmk6m_1oIiq0PrcxCCK9wyFl1Yt-NUPV_zXA&s" alt="logo"
        height="40" width="50" class="me-3">
      <span class="fw-bold">GYM<br><small>System</small></span>
    </a>

    <form class="d-flex me-3 flex-grow-1" role="search">
      <input class="form-control rounded-pill me-2" type="search" placeholder="Search">
      <button class="btn btn-outline-dark rounded-circle" type="submit"><i class="bi bi-search"></i></button>
    </form>

    <div class="navbar-nav">
      <a class="nav-link rounded-pill px-3 py-1 custom-link active" href="#">Dashboard</a>
      <a class="nav-link rounded-pill px-3 py-1 custom-link" href="./workout.html">Workouts</a>

    </div>

    <div class="ms-3 d-flex align-items-center gap-2">
      <a class="btn btn-outline-danger rounded-pill d-flex align-items-center gap-1 custom-login" href="#" id="logoutBtn">
        <i class="bi bi-box-arrow-in-left"></i> Logout
      </a>
    </div>
  </nav>

  <!-- LAYOUT: SIDEBAR + MAIN -->
  <div class="d-flex layout">
    <!-- Sidebar -->
    <aside class="bg-white p-3 flex-shrink-0 border-end">
      <h5 class="fw-bold mb-4">Menu</h5>
      <ul class="nav flex-column">
        <li class="nav-item mb-2">
          <a class="nav-link text-dark" href="#"><i class="bi bi-clipboard-data-fill me-2"></i>Dashboard</a>
        </li>
        <li class="nav-item mb-2">
          <a class="nav-link text-dark" href="#"><i class="bi bi-people-fill me-2"></i>User</a>
        </li>
      </ul>
    </aside>

    <!-- Main -->
    <main class="p-4 flex-grow-1 bg-light">
      <h2 class="mb-4">Hi, <span id="greetName">welcome back</span></h2>

      <!-- Stats cards -->
      <div class="row g-3 mb-4">
        <div class="col-md-3">
          <div class="p-3 rounded bg-white shadow-sm">
            <h6 class="text-muted mb-1">Weekly Sales</h6>
            <h3 class="mb-0">714</h3>
          </div>
        </div>
        <div class="col-md-3">
          <div class="p-3 rounded bg-white shadow-sm">
            <h6 class="text-muted mb-1">New Users</h6>
            <h3 class="mb-0">1.35m</h3>
          </div>
        </div>
        <div class="col-md-3">
          <div class="p-3 rounded bg-white shadow-sm">
            <h6 class="text-muted mb-1">Orders</h6>
            <h3 class="mb-0">1.72m</h3>
          </div>
        </div>
        <div class="col-md-3">
          <div class="p-3 rounded bg-white shadow-sm">
            <h6 class="text-muted mb-1">Messages</h6>
            <h3 class="mb-0">234</h3>
          </div>
        </div>
      </div>

      <!-- Chart card -->
      <div class="row">
        <!--Pie Chart-->
        <div class="col-md-7 mb-4">
          <div class="card shadow-sm p-3" style="height:752px; position:relative; overflow: hidden;">
            <h5 class="card-title mb-3">Current Visits</h5>
            <canvas id="pieChart" style="max-width: 100%; height: 255px; margin: 0 auto;"></canvas>
          </div>
        </div>


        <!--Line Chart-->
        <div class="col-md-5 mb-4">
          <div class="card shadow-sm p-3">
            <h5 class="card-title mb-3">Sale Trend</h5>
            <div style="position: relative; height: 300px;">
              <canvas id="lineChart" class="w-100 h-100"></canvas>
            </div>
          </div>

          <div class="card shadow-sm mt-2">
            <div class="card-body">
              <h5 class="card-title mb-3">Current Subject</h5>
              <div style="position: relative; height: 300px;">
                <canvas id="radarChart" class="w-100 h-100"></canvas>
              </div>
            </div>
          </div>
        </div>

        <!-- Chart Card (Radar Chart) -->
      </div>
    </main>
    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"
      crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.min.js"
      crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="../Javascript/home.js"></script>
    

</body>

</html>

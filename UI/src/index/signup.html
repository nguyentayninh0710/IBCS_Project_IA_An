<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign Up</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <!-- Dùng chung style với login (hoặc copy thành signup.css nếu muốn tách) -->
  <link href="../Style/signup.css" rel="stylesheet" />
</head>

<!-- Có thể override API bằng data-api-base="http://localhost:8001" -->
<body>
  <main class="min-vh-100 d-flex align-items-center bg-soft" data-api-base="">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-11 col-md-10 col-lg-7">
          <div class="card card-raise border-0 shadow rounded-4 overflow-hidden">

            <!-- HEADER -->
            <div class="card-header bg-gradient-primary text-white py-3">
              <div class="header-bar d-grid align-items-center">
                <!-- Logo -->
                <img src="https://dummyimage.com/48x48/ffffff/3b82f6&text=S" alt="Logo" class="header-logo" />

                <h1 class="h4 mb-0 text-center">
                  <i class="bi bi-person-plus me-2"></i>Create Account
                </h1>

                <div class="header-spacer"></div>
              </div>
            </div>

            <div class="card-body p-4 p-md-5">
              <form id="signupForm" novalidate>
                <!-- Full name -->
                <div class="mb-4">
                  <label class="form-label fw-semibold" for="fullName">FULL NAME</label>
                  <input type="text" class="form-control form-control-lg" id="fullName"
                         placeholder="Your full name" minlength="3" maxlength="120" required />
                  <div class="invalid-feedback">Please enter your full name (≥ 3 characters).</div>
                </div>

                <!-- Email -->
                <div class="mb-4">
                  <label class="form-label fw-semibold" for="email">EMAIL</label>
                  <input type="email" class="form-control form-control-lg" id="email"
                         placeholder="you@example.com" required />
                  <div class="invalid-feedback">Please enter a valid email address.</div>
                </div>

                <!-- Password -->
                <div class="mb-2">
                  <label class="form-label fw-semibold" for="password">PASSWORD</label>
                  <div class="input-group input-group-lg">
                    <input type="password" class="form-control" id="password"
                           placeholder="Create a password" minlength="6" required />
                    <button class="btn btn-outline-secondary" type="button" id="togglePwd"
                            aria-label="Show password">
                      <i class="bi bi-eye"></i>
                    </button>
                  </div>
                  <div class="invalid-feedback">Password must be at least 6 characters.</div>
                </div>

                <!-- Confirm -->
                <div class="mb-3">
                  <label class="form-label fw-semibold" for="confirmPwd">CONFIRM PASSWORD</label>
                  <div class="input-group input-group-lg">
                    <input type="password" class="form-control" id="confirmPwd"
                           placeholder="Re-enter password" minlength="6" required />
                    <button class="btn btn-outline-secondary" type="button" id="toggleConfirm"
                            aria-label="Show password">
                      <i class="bi bi-eye"></i>
                    </button>
                  </div>
                  <div class="invalid-feedback">Passwords do not match.</div>
                </div>

                <!-- Terms -->
                <div class="form-check mb-4">
                  <input class="form-check-input" type="checkbox" value="" id="terms" required />
                  <label class="form-check-label" for="terms">
                    I agree to the <a class="link-primary text-decoration-none" href="#">Terms & Privacy</a>.
                  </label>
                  <div class="invalid-feedback">Please accept the terms to continue.</div>
                </div>

                <!-- Alert host -->
                <div id="signup-alert-host" class="mb-3"></div>

                <!-- Submit -->
                <div class="text-center">
                  <button class="btn btn-primary btn-lg px-5" type="submit" id="signupBtn">
                    <span class="btn-text"><i class="bi bi-person-check me-2"></i>Create Account</span>
                    <span class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                  </button>
                </div>

                <!-- Foot link -->
                <div class="text-center mt-3">
                  <span class="text-muted">Already have an account?</span>
                  <a class="link-primary text-decoration-none ms-1" href="./login.html">Login</a>
                </div>
              </form>
            </div>

            <div class="card-footer bg-transparent text-center small text-muted">
              © <span id="year"></span> Your Company. All rights reserved.
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../Javascript/signup.js"></script>
</body>
</html>

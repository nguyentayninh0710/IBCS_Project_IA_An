<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exercises</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="../style/exercises.css">
</head>

<!-- Override API base via data-api-base="http://localhost:8001" if needed -->

<body class="bg-light" data-api-base="">
  <!-- NAVBAR (keep parity with workouts) -->
  <nav class="navbar navbar-expand-lg bg-white shadow-sm px-3 py-2 custom-navbar">
    <a class="navbar-brand d-flex align-items-center me-4" href="home.html">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTmk6m_1oIiq0PrcxCCK9wyFl1Yt-NUPV_zXA&s" alt="logo"
        height="40" width="50" class="me-3">
      <span class="fw-bold">GYM<br><small>System</small></span>
    </a>
    <div class="navbar-nav ms-auto">
      <a class="nav-link rounded-pill px-3 py-1 custom-link" href="home.html">Dashboard</a>
      <a class="nav-link rounded-pill px-3 py-1 custom-link" href="workout.html">Workouts</a>
      <a class="nav-link rounded-pill px-3 py-1 custom-link active" href="#">Exercises</a>
    </div>
    <div class="ms-3 d-flex align-items-center gap-2">
      <a class="btn btn-outline-danger rounded-pill d-flex align-items-center gap-1 custom-login" href="#"
        id="logoutBtn">
        <i class="bi bi-box-arrow-right"></i> Logout
      </a>
    </div>
  </nav>

  <main class="container py-4">
    <h1 class="display-6 fw-bold text-center mb-4">EXERCISES</h1>
    <div class="d-flex align-items-center justify-content-between mb-3">
      <div>
        <h2 id="pageTitle" class="mb-1">Exercises</h2>
        <div id="subTitle" class="text-muted small"></div>
      </div>
      <a id="backLink" class="btn btn-outline-dark d-none" href="workout.html">
        ← Back to Workouts
      </a>
    </div>

    <!-- Large rounded search -->
    <div class="ex-search mb-4 d-flex align-items-center">
      <input id="searchInput" class="form-control ex-search-input" type="search"
        placeholder="Search by name, category, body area, difficulty…" />
      <button id="searchBtn" class="btn ex-search-btn ms-2" aria-label="Search">
        <i class="bi bi-search"></i>
      </button>
    </div>

    <!-- List (stacked cards like your sketch) -->
    <div id="list" class="vstack gap-3"></div>

    <!-- Pagination -->
    <div id="pager" class="pagination-wrap mt-4 d-flex justify-content-center align-items-center gap-2"></div>

    <!-- Empty state -->
    <div id="emptyState" class="text-center text-muted py-5 d-none">
      <i class="bi bi-inbox fs-2 d-block mb-2"></i>
      <p class="mb-0">No exercises found.</p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../javascript/exercises.js"></script>
</body>

</html>

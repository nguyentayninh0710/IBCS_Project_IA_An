<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exercise Video</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <!-- Reuse your list styles; add small overrides for video page -->
  <link rel="stylesheet" href="../style/exercises.css">
  <link rel="stylesheet" href="../style/exercises-video.css">
</head>

<!-- Override API base via data-api-base="http://localhost:8002" if exercises.py runs on 8002 -->
<body class="bg-light" data-api-base="">
  <!-- NAVBAR (same as EXERCISES) -->
  <nav class="navbar navbar-expand-lg bg-white shadow-sm px-3 py-2 custom-navbar">
    <a class="navbar-brand d-flex align-items-center me-4" href="home.html">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTmk6m_1oIiq0PrcxCCK9wyFl1Yt-NUPV_zXA&s"
           alt="logo" height="40" width="50" class="me-3">
      <span class="fw-bold">GYM<br><small>System</small></span>
    </a>
    <div class="navbar-nav ms-auto">
      <a class="nav-link rounded-pill px-3 py-1 custom-link" href="home.html">Dashboard</a>
      <a class="nav-link rounded-pill px-3 py-1 custom-link" href="workout.html">Workouts</a>
      <a class="nav-link rounded-pill px-3 py-1 custom-link active" href="exercises.html">Exercises</a>
    </div>
    <div class="ms-3 d-flex align-items-center gap-2">
      <a class="btn btn-outline-danger rounded-pill d-flex align-items-center gap-1 custom-login" href="#" id="logoutBtn">
        <i class="bi bi-box-arrow-right"></i> Logout
      </a>
    </div>
  </nav>

  <main class="container py-4">
    <h1 class="display-6 fw-bold text-center mb-4">EXERCISE VIDEO</h1>

    <div class="d-flex align-items-center justify-content-between mb-3">
      <div>
        <h2 id="pageTitle" class="mb-1">Workout Exercises</h2>
        <div id="subTitle" class="text-muted small">Category › Name</div>
      </div>
      <a id="backLink" class="btn btn-outline-dark" href="exercises.html">← Back to Exercises</a>
    </div>

    <!-- Player card -->
    <section class="card border-0 shadow-sm rounded-3 overflow-hidden mb-3">
      <div class="ratio ratio-16x9 bg-dark position-relative" id="videoWrap">
        <!-- iframe injected by JS -->
        <div id="noVideo" class="position-absolute top-50 start-50 translate-middle text-white text-center d-none">
          <div class="fs-5 fw-semibold">No video available</div>
          <div class="small text-white-50">This exercise doesn’t have a video URL.</div>
        </div>
      </div>

      <div class="d-flex align-items-center justify-content-between px-2 py-1 border-top">
        <div class="d-flex align-items-center gap-2">
          <button id="openInYouTube" class="btn btn-sm btn-outline-secondary" type="button" disabled>
            <i class="bi bi-youtube"></i> Open on YouTube
          </button>
        </div>
        <div class="text-muted small"><i class="bi bi-aspect-ratio"></i> Tip: Use full-screen in the player.</div>
      </div>
    </section>

    <!-- Details row (mirrors your wireframe) -->
    <section class="card border-0 shadow-sm rounded-3 p-3">
      <div class="row g-3 align-items-stretch">
        <!-- Left: Body area checklist -->
        <div class="col-12 col-md-4">
          <div class="d-flex">
            <div class="me-3">
              <img src="../images/image-removebg-preview.png" alt="Body" class="body-figure">
            </div>
            <ul class="list-unstyled mb-0 body-area-list">
              <li data-area="full_body"><span class="box"></span> full body</li>
              <li data-area="upper"><span class="box"></span> upper</li>
              <li data-area="lower"><span class="box"></span> lower</li>
              <li data-area="core"><span class="box"></span> core</li>
            </ul>
          </div>
        </div>

        <!-- Middle: badges -->
        <div class="col-12 col-md-4 d-flex flex-column justify-content-center gap-3">
          <div class="pill-badge" id="badgeDifficulty">Difficulty: —</div>
          <div class="pill-badge" id="badgeUnit">Unit: —</div>
        </div>

        <!-- Right: description -->
        <div class="col-12 col-md-4">
          <div class="desc-box">
            <div class="small text-muted mb-2">Description</div>
            <div id="descText" class="desc-text">—</div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../javascript/exercises-video.js"></script>
</body>
</html>

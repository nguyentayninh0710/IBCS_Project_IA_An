<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="..//style/login.css">
</head>

<body class="bg-light">
    <div class="container d-flex justify-content-center align-items-center min vh-100">
        <div class="card p-4 shadow-sm" style="width: 100%; max-width: 400px;">
            <h3 class="mb-3 text-center">Login</h3>
            <form id="loginForm">
                <div class="mb-3">
                    <lable for="loginEmail" class="form-lable"> Email address </lable>
                    <input type="email" class="form-control" id="LoginEmail" required>
                </div>
                <div class="mb-3">
                    <lable for="loginPassword" class="form-lable"> Password </lable>
                    <input type="Password" class="form-control" id="LoginPassword" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Login</button>
                <div class="text center mt-3">
                <small>Don't have account? <a href="#" onclick="switchToSignup()">Sign up</a></small>
            </div>
            </form>
        </div>
    </div>

    <template id="signupTemplate">
        <div class="container d-flex justify-content-center align-items-center min vh-100">
        <div class="card p-4 shadow-sm" style="width: 100%; max-width: 400px;">
            <h3 class="mb-3 text-center">Sign up</h3>
            <form id="loginForm">
                <div class="mb-3">
                    <lable for="loginEmail" class="form-lable"> Email address </lable>
                    <input type="email" class="form-control" id="LoginEmail" required>
                </div>
                <div class="mb-3">
                    <lable for="loginPassword" class="form-lable"> Password </lable>
                    <input type="Password" class="form-control" id="LoginPassword" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Sign up</button>
                <div class="text center mt-3">
                <small>Already have an account? <a href="#" onclick="location.reload()">Login</a></small>
            </div>
            </form>
        </div>
    </div>
    </template>


    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.min.js"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="../Javascript/home.js"></script>
    <script src="../Javascript/login.js"></script>
</body>

</html>
